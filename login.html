<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayToNote - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .role-btn.teacher.active {
            background: #2196F3;
            border-color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="text-center mb-4">WayToNote</h2>
        
        <form id="loginForm">
            <div class="role-selector">
                <button type="button" class="role-btn student active" onclick="selectRole('student')">Student</button>
                <button type="button" class="role-btn teacher" onclick="selectRole('teacher')">Teacher</button>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-success w-100" id="loginBtn">Login as Student</button>
        </form>
    </div>

    <script>
        let currentRole = 'student';

        function selectRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.role-btn.${role}`).classList.add('active');
            document.getElementById('loginBtn').textContent = `Login as ${role.charAt(0).toUpperCase() + role.slice(1)}`;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (currentRole === 'student') {
                if (username === 'test1' && password === '1234') {
                    localStorage.setItem('userType', 'student');
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid student credentials');
                }
            } else {
                if (username === 'test2' && password === '12345') {
                    localStorage.setItem('userType', 'teacher');
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid teacher credentials');
                }
            }
        });
    </script>
</body>
</html>
